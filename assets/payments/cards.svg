<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 48" fill="none">
  <!-- Official Cards: Visa & Mastercard -->
  <rect width="40" height="40" x="4" y="4" rx="10" fill="#0F172A"/>
  <!-- MasterCard Interlocking Circles -->
  <circle cx="20" cy="24" r="7.5" fill="#EB001B"/>
  <circle cx="28" cy="24" r="7.5" fill="#F79E1B" fill-opacity="0.85"/>
  <!-- Typography -->
  <text x="50" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="900" fill="#1A1F71">VISA</text>
  <text x="92" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#EB001B">Master<tspan fill="#F79E1B">card</tspan></text>
  <text x="50" y="37" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="600" fill="#64748B" letter-spacing="0.3">NEPAL BANK CARDS</text>
</svg>
